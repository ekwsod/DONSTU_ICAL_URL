name: MyPairs
options:
  bundleIdPrefix: ru.ekwsod
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  MyPairs:
    type: application
    platform: iOS
    sources: [MyPairs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ekwsod.mypairs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Мои пары
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MyPairsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MyPairsTests]
    dependencies:
      - target: MyPairs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MyPairsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MyPairsUITests]
    dependencies:
      - target: MyPairs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  MyPairs:
    build:
      targets:
        MyPairs: all
    test:
      targets: [MyPairsTests, MyPairsUITests]
