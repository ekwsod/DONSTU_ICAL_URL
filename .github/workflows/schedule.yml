name: Schedule Alarm Pages

on:
  schedule:
    # 17:17 UTC = 20:17 по Москве (UTC+3): вечерний запуск. Ночные запуски GitHub
    # часто задерживает на несколько часов, а iPhone забирает файл в 04:00 —
    # тогда он берёт будильник из поля `tomorrow` вечернего файла.
    - cron: '17 17 * * *'
    # 23:00 UTC = 02:00 по Москве (UTC+3)
    - cron: '0 23 * * *'
    # 23:30 UTC = 02:30 по Москве (UTC+3) — повтор для надежности
    - cron: '30 23 * * *'
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit and integration tests
        run: |
          python -m unittest discover -s tests -v

      - name: Fetch schedule and generate JSON
        env:
          DONSTU_ICAL_URL: ${{ secrets.DONSTU_ICAL_URL }}
          BOT_PUSH_URL: ${{ secrets.BOT_PUSH_URL }}
          BOT_PUSH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN }}
        run: |
          python schedule_alarm.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
