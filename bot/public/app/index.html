<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Мои пары</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/app/style.css"></head>
<body><main><header><div class="brand">Мои пары <span>ДГТУ</span></div><button id="refresh" aria-label="Обновить">↻</button></header><nav class="tabs" aria-label="Раздел"><button data-tab="schedule" aria-selected="true">Расписание</button><button data-tab="homework" aria-selected="false">Задания <span id="count"></span></button></nav><section id="schedule"><div class="heading"><h1 id="month">Расписание</h1><button id="today">Сегодня</button></div><div id="dates" class="dates" aria-label="Выбрать день"></div><div id="dayTitle" class="daytitle"></div><div id="lessons"></div></section><section id="homework" hidden><div class="heading"><h1>Задания</h1><button id="add">+ Записать</button></div><label class="filter"><input id="completed" type="checkbox"> Показывать выполненные</label><div id="tasks"></div></section><p id="status" role="status">Загружаю расписание…</p><p id="updated" class="updated"></p></main><dialog id="editor"><form id="form"><div class="heading"><h2>Новое задание</h2><button type="button" id="close" aria-label="Закрыть">✕</button></div><label>К какой паре<select id="target" required></select></label><label>Что нужно сделать<textarea id="text" required maxlength="2000" placeholder="Например, решить задачи 1–5" rows="4"></textarea></label><p id="formError" role="alert"></p><button class="primary" type="submit">Сохранить задание</button></form></dialog><script src="/app/app.js" defer></script></body></html>
