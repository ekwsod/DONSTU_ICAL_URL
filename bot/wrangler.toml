name = "donstu-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Координаты для погоды: главный корпус ДГТУ, пл. Гагарина, 1 (Ростов-на-Дону)
[vars]
WEATHER_LAT = "47.2373"
WEATHER_LON = "39.7116"

# Раз в 5 минут проверяем, не пора ли прислать погоду перед выходом (время в cron — UTC,
# само решение «пора или нет» считается по Москве в коде)
[triggers]
crons = ["*/5 * * * *"]

# Workers AI: комментарий к плану дня и разбор дз из свободного текста
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "SCHEDULE"
id = "1f6e5381f87d4e46b9261cc599696b44"
